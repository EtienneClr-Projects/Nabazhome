[project]
name = "nabazhome"
version = "0.1.0"
description = "Nabaztag dashboard and device service stack"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
calendar = [
    "google-api-python-client>=2,<3",
    "google-auth[requests]>=2,<3",
    "google-auth-oauthlib>=1,<2",
]

[dependency-groups]
dev = ["httpx>=0.27,<1"]

[tool.uv]
package = false